type: custom:bubble-card
card_type: pop-up
hash: '#yandex_mini'
margin_top_mobile: auto
margin_top_desktop: auto
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
show_header: false
close_by_clicking_outside: false
backdrop_blur: '5'
bg_blur: '100'
bg_opacity: '50'
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    background: rgba(255, 255, 255, 0.1);  
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Станция Мини (Гостиная)
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: yandex:station-mini-2
      - type: spacer
      - type: template
        entity: media_player.yandex_station_m00en2100jayck
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: media_player.yandex_station_m00en2100jayck
        picture: |
          {{state_attr(entity, 'entity_picture')}}
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: yandex:station-mini-2
        icon_color: '1'
        card_mod:
          style:
            .: |
              {% set scale = '1' %}
              {% set hover = '' %}
              {% set stating = 'true' %}
              {% set state_on = '' %}
              {% set color = 'rgba(120,120,120,0.2)' %}
              {% set hover_color_off = 'rgba(120,120,120,0.3) !important' %}
              {% include 'chip_settings_style.jinja' %}
    alignment: center
    card_mod:
      style:
        .: |
          ha-card {
             --chip-background: none !important;
             --chip-border-radius: 1000px;
             zoom: 6;
             #--chip-height: 200px;
             --chip-spacing: {{chip_spacing|default(0)}}px;
             margin: 2px;
             }
  - type: custom:mushroom-template-card
    features_position: bottom
    entity: media_player.yandex_station_m00en2100jayck
    grid_options:
      columns: 12
      rows: auto
    tap_action:
      action: none
    vertical: true
    icon_tap_action:
      action: none
    primary: >
      {% if state_attr(config.entity,'media_title') is none or 
      state_attr(config.entity,'media_title') == ''%}  Станция Мини (Гостиная)

      {% else%} {{state_attr(config.entity, 'media_title')}}

      {% endif %}
    secondary: |
      {% if  state_attr(config.entity,'media_artist') is none %} Неизвестно
      {% else%} {{state_attr(config.entity, 'media_artist')}}
      {% endif %}
    card_mod:
      style: |
        ha-card {
          zoom: 1.5;
          background: none;
        }
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.stantsiia_mini_gostinaia_dlitelnost
        state: 'on'
    card:
      entity: media_player.yandex_station_m00en2100jayck
      tap_action: none
      hide:
        icon: true
        name: true
        runtime: true
        source: true
        power: true
        state_label: true
        volume: true
        info: true
        progress: false
        controls: true
      more_info: false
      type: custom:mini-media-player
      toggle_power: false
      group: true
      volume_stateless: false
      card_mod:
        style:
          .: |
            ha-card {
              height: var(--mmp-progress-height);
              --mmp-accent-color: rgba(var(--rgb-primary-text-color),1);;
              --ha-card-border-width: 0;
              margin: 0px 30px; 
            }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_m00en2100jayck
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-previous
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id: media_player.yandex_station_m00en2100jayck
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_m00en2100jayck
        grid_options:
          columns: 12
          rows: auto
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.yandex_station_play_pause_extended
          data:
            variables:
              entity: media_player.yandex_station_m00en2100jayck
        vertical: true
        icon: |-
          {% if is_state(entity, 'paused')%} fas:play
            {% elif is_state(entity, 'playing')%} fas:pause
          {% else %}fas:play{% endif%}
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_m00en2100jayck
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-next
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.yandex_station_m00en2100jayck
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;

        }
  - type: custom:mushroom-media-player-card
    entity: media_player.yandex_station_m00en2100jayck
    volume_controls:
      - volume_set
    layout: horizontal
    primary_info: none
    secondary_info: none
    icon_type: none
    card_mod:
      style:
        mushroom-media-player-volume-control$: |
          mushroom-slider {
            --main-color: #505050 !important;
            --bg-color: #50505055 !important;
            --control-height: 25px !important;
          }
        .: |
          ha-card {
            background: transparent !important;
            opacity: 100%;
            margin: 0px 20px !important;
            border-width: 0px;
            margin: 0px 0px 0px;
          }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_m00en2100jayck
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:account-music
        tap_action:
          action: perform-action
          perform_action: media_player.play_media
          target:
            entity_id: media_player.yandex_station_m00en2100jayck
          data:
            media_content_type: command
            media_content_id: другие треки этого исполнителя
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_m00en2100jayck
        grid_options:
          columns: 12
          rows: auto
        tap_action:
          action: perform-action
          perform_action: media_player.play_media
          target:
            entity_id: media_player.yandex_station_m00en2100jayck
          data:
            media_content_type: command
            media_content_id: включи любимое
        vertical: true
        icon: mdi:heart-multiple
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_m00en2100jayck
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:chart-timeline-variant-shimmer
        tap_action:
          action: perform-action
          perform_action: media_player.play_media
          target:
            entity_id: media_player.yandex_station_m00en2100jayck
          data:
            media_content_type: command
            media_content_id: включи популярное
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.multirum_sostoianie
            state: 'off'
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: media_player.yandex_station_m00en2100jayck
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:play-box-multiple
          tap_action:
            action: perform-action
            perform_action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_m00en2100jayck
            data:
              media_content_type: command
              media_content_id: продолжи везде
          vertical: true
          icon_tap_action:
            action: none
          color: white
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.multirum_sostoianie
            state: 'on'
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: media_player.yandex_station_m00en2100jayck
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:arrow-down
          tap_action:
            action: perform-action
            perform_action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_m00en2100jayck
            data:
              media_content_type: command
              media_content_id: продолжи в гостиной
          vertical: true
          icon_tap_action:
            action: none
          color: white
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
    card_mod:
      style: |
        ha-card {
         background: none !important;

        }
popup_mode: default
card_layout: large
slide_to_close_distance: '500'
